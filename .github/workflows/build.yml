name: build

# Builds the imgsrch release artifact per platform: the Go binary plus the
# three engine binaries (nrvnad/wrk/flw) in one tarball.
#
# llama.cpp is vendored manually here instead of via `submodules: true`
# because the local submodule pin includes two Metal patch commits that exist
# only as patches/*.patch in this repo. CI clones the pinned upstream base and
# applies them — identical content, fetchable anywhere.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  LLAMA_BASE: 3ac3c20c968cc6d485d89382f202ec440767875a # b9572 era

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Vendor llama.cpp at pinned base + Metal patches
        run: |
          rm -rf third_party/llama.cpp
          git clone --no-checkout https://github.com/ggml-org/llama.cpp third_party/llama.cpp
          git -C third_party/llama.cpp checkout "$LLAMA_BASE"
          git -C third_party/llama.cpp apply "$GITHUB_WORKSPACE"/patches/*.patch

      - name: Build engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build -j4 --target nrvnad wrk flw

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build imgsrch
        working-directory: imgsrch-go
        run: go build -trimpath -ldflags="-s -w" -o ../dist/stage/imgsrch .

      - name: Package
        run: |
          kit="imgsrch-${{ matrix.target }}"
          mkdir -p "dist/$kit/bin"
          mv dist/stage/imgsrch "dist/$kit/"
          cp build/nrvnad build/wrk build/flw "dist/$kit/bin/"
          cp LICENSE "dist/$kit/"
          tar -C dist -czf "dist/$kit.tar.gz" "$kit"
          shasum -a 256 "dist/$kit.tar.gz" | tee "dist/$kit.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: imgsrch-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
