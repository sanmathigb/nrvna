name: build

# Builds and tests the nrvna primitives on every platform.
#
# llama.cpp is vendored at the committed submodule revision. The Metal
# discrete-GPU patch in patches/ is NOT applied here: it only helps Intel Macs
# with a discrete GPU doing offload. It is a no-op (and a slight pessimization)
# on Apple Silicon's unified memory, and is unused on Linux. It stays an opt-in
# local overlay for dev.

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    tags: ['v*']
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            deployment_target: '13.3'
          - os: macos-15-intel
            target: darwin-x86_64
            deployment_target: '13.3'
          - os: ubuntu-22.04
            target: linux-x86_64
            deployment_target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build engine
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF
          cmake --build build -j4 --target nrvnad wrk flw nrvna_test_binaries

      - name: Test contracts
        run: ctest --test-dir build --output-on-failure

      - name: Package nrvna
        run: |
          kit="nrvna-${{ matrix.target }}"
          mkdir -p "dist/$kit/bin"
          cp build/nrvnad build/wrk build/flw "dist/$kit/bin/"
          cp README.md INSTALL.md AGENTS.md CONTEXT.md ADVANCED.md \
            CONFIGURATION.md ARCHITECTURE.md \
            CHANGELOG.md SECURITY.md CONTRIBUTING.md LICENSE install.sh "dist/$kit/"
          mkdir -p "dist/$kit/docs" "dist/$kit/skills"
          cp docs/README.md docs/how-it-works.md docs/why.md "dist/$kit/docs/"
          cp -R skills/nrvna "dist/$kit/skills/"
          cp third_party/llama.cpp/LICENSE "dist/$kit/LICENSE-llama.cpp"
          tar -C dist -czf "dist/$kit.tar.gz" "$kit"
          (cd dist && shasum -a 256 "$kit.tar.gz") > "dist/$kit.tar.gz.sha256"

      - name: Smoke-test packaged nrvna binaries
        run: |
          kit="nrvna-${{ matrix.target }}"
          mkdir -p dist/smoke
          tar -C dist/smoke -xzf "dist/$kit.tar.gz"
          test -f "dist/smoke/$kit/README.md"
          test -f "dist/smoke/$kit/INSTALL.md"
          test -f "dist/smoke/$kit/AGENTS.md"
          test -f "dist/smoke/$kit/CONFIGURATION.md"
          test -f "dist/smoke/$kit/docs/README.md"
          test -f "dist/smoke/$kit/docs/how-it-works.md"
          test -f "dist/smoke/$kit/skills/nrvna/SKILL.md"
          test -f "dist/smoke/$kit/LICENSE-llama.cpp"
          (cd dist && shasum -a 256 -c "$kit.tar.gz.sha256")
          test -x "dist/smoke/$kit/install.sh"
          "dist/smoke/$kit/bin/nrvnad" --version
          "dist/smoke/$kit/bin/wrk" --version
          "dist/smoke/$kit/bin/flw" --version
          if [ "${{ runner.os }}" = "macOS" ]; then
            vtool -show-build "dist/smoke/$kit/bin/nrvnad" | grep -q "minos ${{ matrix.deployment_target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nrvna-${{ matrix.target }}
          path: |
            dist/nrvna-*.tar.gz
            dist/nrvna-*.tar.gz.sha256


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
